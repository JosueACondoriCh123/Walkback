<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walkback · 3 minutos</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<!-- Written with Claude Code (AI), directed and tested by team MARSXR.
     No text lives here: every word, number and note is in content.js. The slides are built by deck.js.
     index.html?lang=en opens in English; index.html?lang=en&print=1 lays out the 7 pages of the PDF. -->
<main id="stage">
  <div id="layers"></div>
  <div id="slides"></div>
</main>
<div id="print"></div>
<div id="hud"></div>
<div id="notes"></div>
<div id="progress"></div>
<input id="video-file" type="file" accept="video/*" hidden>

<!-- library (no internet: everything is local) -->
<script src="vendor/three.min.js"></script>
<!-- data from the app's site package (tools/build_pitch_data.py) -->
<script src="data/gale.js"></script>
<script src="data/stops.js"></script>
<script src="data/globe.js"></script>
<script src="data/sajama.js"></script>
<!-- the app's own rule, ported (tools/check-model.js checks it against the app) -->
<script src="walkback-model.js"></script>
<!-- every {key} of the texts, from the app's rule and content.js FACTS (tools/check-content.js checks the texts) -->
<script src="placeholders.js"></script>
<!-- every text of the presentation -->
<script src="content.js"></script>
<!-- scenes -->
<script src="scenes/common.js"></script>
<script src="scenes/gale-core.js"></script>
<script src="scenes/gale.js"></script>
<script src="scenes/globe.js"></script>
<script src="scenes/panorama.js"></script>
<script src="scenes/board.js"></script>
<script src="deck.js"></script>
</body>
</html>
