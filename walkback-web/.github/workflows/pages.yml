# Written with Claude Code (AI), directed and tested by team MARSXR
#
# Publishes web/ to GitHub Pages every time main changes there.
# One-time setup (Daniel): Settings -> Pages -> Source: GitHub Actions.
# No Git LFS: web/ must not contain LFS files (Pages cannot serve them).
name: Publish web page

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fail if web/ has Git LFS pointers
        run: |
          if grep -rlI "^version https://git-lfs.github.com/spec/" web/; then
            echo "These web/ files are LFS pointers. Take web/ out of LFS in .gitattributes."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
